# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  python: circleci/python@2.1.1
  codecov: codecov/codecov@3.2.4

commands:
  install-miniconda:
    description: Ensure conda is on PATH (install if missing on Windows/macOS)
    steps:
      - run:
          name: Install Miniconda
          command: |
            set -euo pipefail

            conda_present_at() {
              local root="$1"
              [ -n "${root}" ] && { [ -f "${root}/Scripts/conda.exe" ] || [ -f "${root}/bin/conda" ]; }
            }

            if command -v conda >/dev/null 2>&1; then
              echo "Conda already available at $(command -v conda)"
              conda --version
              exit 0
            fi

            MINICONDA_DIR=""
            case "$(uname -s)" in
              MINGW*|MSYS*|CYGWIN*)
                for candidate in \
                  "${CONDA:-}" \
                  "/c/Miniconda" \
                  "/c/Miniconda3" \
                  "/c/ProgramData/miniconda3" \
                  "/c/ProgramData/Miniconda3" \
                  "${HOME}/miniconda3" \
                  "${HOME}/Miniconda3" \
                  "${HOME}/appdata/Local/miniconda3" \
                  "${HOME}/appdata/Local/Continuum/miniconda3"; do
                  if conda_present_at "${candidate}"; then
                    MINICONDA_DIR="${candidate}"
                    break
                  fi
                done

                if [ -z "${MINICONDA_DIR}" ]; then
                  conda_exe="$(cmd.exe //c "where conda 2>nul" 2>/dev/null | head -n1 | tr -d '\r' || true)"
                  if [ -n "${conda_exe}" ]; then
                    if command -v cygpath >/dev/null 2>&1; then
                      conda_exe="$(cygpath -u "${conda_exe}")"
                    else
                      conda_exe="$(echo "${conda_exe}" | sed 's|\\|/|g' | sed 's|^\([A-Za-z]\):|/\L\1|')"
                    fi
                    MINICONDA_DIR="$(cd "$(dirname "${conda_exe}")/.." && pwd)"
                  fi
                fi

                if [ -z "${MINICONDA_DIR}" ]; then
                  MINICONDA_DIR="${HOME}/miniconda3"
                fi

                if ! conda_present_at "${MINICONDA_DIR}"; then
                  echo "Installing Miniconda to %USERPROFILE%\\miniconda3 via cmd.exe..."
                  curl -fsSL -o miniconda-installer.exe \
                    "https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe"
                  # /D= must be last and must not be quoted (NSIS installer requirement).
                  cmd.exe //c "miniconda-installer.exe /InstallationType=JustMe /RegisterPython=0 /S /D=%USERPROFILE%\\miniconda3"
                  rm -f miniconda-installer.exe
                  MINICONDA_DIR="${HOME}/miniconda3"
                fi
                ;;
              Darwin)
                MINICONDA_DIR="${HOME}/miniconda3"
                if ! conda_present_at "${MINICONDA_DIR}"; then
                  ARCH="$(uname -m)"
                  if [ "${ARCH}" = "arm64" ]; then
                    INSTALLER_URL="https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh"
                  else
                    INSTALLER_URL="https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh"
                  fi
                  curl -fsSL -o miniconda-installer.sh "${INSTALLER_URL}"
                  bash miniconda-installer.sh -b -p "${MINICONDA_DIR}"
                  rm -f miniconda-installer.sh
                fi
                ;;
              *)
                echo "install-miniconda: unsupported OS $(uname -s)"
                exit 1
                ;;
            esac

            if ! conda_present_at "${MINICONDA_DIR}"; then
              echo "install-miniconda: conda not found under ${MINICONDA_DIR}"
              exit 1
            fi
            echo "Using Miniconda at ${MINICONDA_DIR}"

            {
              echo "export MINICONDA_DIR=${MINICONDA_DIR}"
              case "$(uname -s)" in
                MINGW*|MSYS*|CYGWIN*)
                  echo "export PATH=\"${MINICONDA_DIR}:${MINICONDA_DIR}/Library/bin:${MINICONDA_DIR}/Scripts:\${PATH}\""
                  ;;
                Darwin)
                  echo "export PATH=\"${MINICONDA_DIR}/bin:\${PATH}\""
                  ;;
              esac
            } >> "${BASH_ENV}"
            # shellcheck source=/dev/null
            source "${BASH_ENV}"
            conda --version

  run-conda-test-suite:
    description: Conda env, deps, and pytest suite (mirrors Linux build-and-test)
    parameters:
      upload_coverage:
        type: boolean
        default: false
    steps:
      - run:
          name: Setup conda environment, install deps, and run tests
          command: |
            set -euo pipefail
            # shellcheck source=/dev/null
            [ -f "${BASH_ENV}" ] && source "${BASH_ENV}"

            eval "$(conda shell.bash hook)"
            conda update -y conda
            conda create -n cheminf python=3.11 -y
            conda activate cheminf

            python -m pip install --upgrade pip

            # Core stack shared across Linux/Windows/macOS (matches Linux job).
            CONDA_PKGS=(
              openbabel=3.1.1
              xtb=6.7.1
              glib
              gtk3
              pango
            )
            case "$(uname -s)" in
              Linux)
                CONDA_PKGS+=(
                  libgfortran=14.2.0
                  libgomp
                  libxkbcommon
                  mscorefonts
                  fonts-conda-forge
                )
                ;;
              Darwin)
                CONDA_PKGS+=(libgfortran=14.2.0)
                ;;
            esac
            conda install -y -c conda-forge "${CONDA_PKGS[@]}"

            case "$(uname -s)" in
              Linux)
                export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
                ;;
              Darwin)
                export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
                ;;
              MINGW*|MSYS*|CYGWIN*)
                export PATH="$CONDA_PREFIX/Library/bin:$CONDA_PREFIX/Scripts:$PATH"
                ;;
            esac

            pip install aqme==2.0.0
            pip install .
            pip install pytest pytest-cov pytest-qt

            # xtb needs libgomp from the conda env (verify before AQME tests).
            case "$(uname -s)" in
              Linux)
                export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
                ;;
              Darwin)
                export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
                ;;
            esac
            command -v xtb
            xtb --version
            python -c "import importlib.metadata as m; import aqme; print('aqme', m.version('aqme'))"

            set +e

            python -m pytest \
              -v \
              --ignore=tests/test_easyrob.py \
              --cov=robert \
              --cov-report=

            CORE_EXIT_CODE=$?
            if [ "$CORE_EXIT_CODE" -ne 0 ]; then
              echo "[CI] Core tests failed with exit code $CORE_EXIT_CODE"
              set -e
              exit "$CORE_EXIT_CODE"
            fi

            export QT_QPA_PLATFORM=offscreen
            export QT_OPENGL=software
            export QT_RHI=software
            export QTWEBENGINE_DISABLE_SANDBOX=1
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu"

            if [ "$(uname -s)" = "Linux" ] && command -v xvfb-run >/dev/null 2>&1; then
              xvfb-run -s "-screen 0 1920x1080x24" \
                python -m pytest \
                  -vv \
                  --cov=robert \
                  --cov-append \
                  --cov-report= \
                  tests/test_easyrob.py
            else
              python -m pytest \
                -vv \
                --cov=robert \
                --cov-append \
                --cov-report= \
                tests/test_easyrob.py
            fi

            GUI_EXIT_CODE=$?
            set -e

            if [ "$GUI_EXIT_CODE" -eq 139 ] || [ "$GUI_EXIT_CODE" -eq 134 ]; then
              echo "[CI WARNING] GUI tests completed, but Qt/PySide6 triggered a crash on interpreter shutdown (exit code $GUI_EXIT_CODE)."
              echo "[CI WARNING] Treating exit code $GUI_EXIT_CODE as success because all tests passed."
              GUI_EXIT_CODE=0
            fi

            if [ "$GUI_EXIT_CODE" -ne 0 ]; then
              echo "[CI] GUI tests failed with exit code $GUI_EXIT_CODE"
              exit "$GUI_EXIT_CODE"
            fi

            if [ "<< parameters.upload_coverage >>" = "true" ]; then
              coverage xml
              rm -rf /tmp/*
              cp coverage.xml /tmp/
              cp -r robert /tmp/
            fi

jobs:
  build-and-test:
    docker:
      - image: continuumio/miniconda3
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip

      - run:
          name: Install system dependencies for Qt/PySide6 and WeasyPrint
          command: |
            apt-get update
            apt-get install -y \
              xvfb \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libxcb-render0 \
              libxcb-shape0 \
              libxcb-shm0 \
              libxcb-randr0 \
              libxcb-xfixes0 \
              libxcb-keysyms1 \
              libxrandr2 \
              libxcomposite1 \
              libxdamage1 \
              libxi6 \
              libxtst6 \
              libxext6 \
              libxrender1 \
              libxau6 \
              libxdmcp6 \
              libice6 \
              libsm6 \
              libdbus-1-3 \
              libgl1 \
              libegl1 \
              libgles2 \
              libopengl0 \
              libfontconfig1 \
              libfreetype6 \
              libharfbuzz0b \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libcairo2 \
              libpangoft2-1.0-0 \
              shared-mime-info \
              libnss3 \
              libnspr4 \
              libxkbcommon0 \
              libxkbfile1 \
              libxkbcommon-x11-0 \
              libxcb-util1 \
              libxcb-xkb1 \
              libxss1 \
              libxcursor1 \
              libatomic1 \
              zlib1g \
              libpcre2-8-0 \
              libffi8 \
              libuuid1 \
              libglib2.0-0 \
              libgcrypt20 \
              libgpg-error0 \
              libdouble-conversion3 \
              libmd4c0 \
              libjpeg62-turbo \
              libevent-2.1-7 \
              libasound2 \
              libasound2-data \
              libdrm2 \
              libxshmfence1 \
              libgl1-mesa-dri \
              fonts-dejavu-core \
              fonts-dejavu-extra \
              ca-certificates

            apt-get install -y libicu72 || \
            apt-get install -y libicu70 || \
            apt-get install -y libicu67 || true

      - run-conda-test-suite:
          upload_coverage: true

      - persist_to_workspace:
          root: /tmp
          paths:
            - coverage.xml
            - robert

  build-and-test-windows:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
    shell: bash.exe
    steps:
      - checkout
      - install-miniconda
      - run-conda-test-suite:
          upload_coverage: false

  build-and-test-macos:
    macos:
      xcode: "16.2.0"
    resource_class: macos.m1.medium.gen1
    steps:
      - checkout
      - install-miniconda
      - run-conda-test-suite:
          upload_coverage: false

  codecov-coverage:
    docker:
      - image: cimg/python:3.12
    steps:
      - attach_workspace:
          at: /tmp
      - checkout
      - codecov/upload:
          file: /tmp/coverage.xml
          token: CODECOV_TOKEN

  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Ruff
          command: python -m pip install 'ruff==0.14.5'
      - run:
          name: Ruff check
          command: ruff check .
      - run:
          name: Ruff format check
          command: ruff format --check .

workflows:
  sample:
    jobs:
      - lint
      - build-and-test:
          requires:
            - lint
      - build-and-test-windows:
          requires:
            - lint
      - build-and-test-macos:
          requires:
            - lint
      - codecov-coverage:
          requires:
            - build-and-test
