# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/2.0/orb-intro/
orbs:
  # The python orb contains a set of prepackaged CircleCI configuration you can use repeatedly in your configuration files
  # Orb commands and jobs help you with common scripting around a language/tool
  # so you dont have to copy and paste it everywhere.
  # See the orb documentation here: https://circleci.com/developer/orbs/orb/circleci/python
  python: circleci/python@2.1.1

# Reusable step sequences (CircleCI 2.1 "commands") shared between build-and-test-core and
# build-and-test-gui, which used to be a single job - split into two so GUI tests (Xvfb/Qt)
# and core tests each get their own independent ~1h max job runtime instead of sharing one,
# and so they run concurrently instead of GUI only starting after core tests finish
commands:
  install_system_deps:
    steps:
      - run:
          name: Install system dependencies for Qt/PySide6 and WeasyPrint
          command: |
            apt-get update
            apt-get install -y \
              curl \
              xvfb \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libxcb-render0 \
              libxcb-shape0 \
              libxcb-shm0 \
              libxcb-randr0 \
              libxcb-xfixes0 \
              libxcb-keysyms1 \
              libxrandr2 \
              libxcomposite1 \
              libxdamage1 \
              libxi6 \
              libxtst6 \
              libxext6 \
              libxrender1 \
              libxau6 \
              libxdmcp6 \
              libice6 \
              libsm6 \
              libdbus-1-3 \
              libgl1 \
              libegl1 \
              libgles2 \
              libopengl0 \
              libfontconfig1 \
              libfreetype6 \
              libharfbuzz0b \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libcairo2 \
              libpangoft2-1.0-0 \
              shared-mime-info \
              libnss3 \
              libnspr4 \
              libxkbcommon0 \
              libxkbfile1 \
              libxkbcommon-x11-0 \
              libxcb-util1 \
              libxcb-xkb1 \
              libxss1 \
              libxcursor1 \
              libatomic1 \
              zlib1g \
              libpcre2-8-0 \
              libffi8 \
              libuuid1 \
              libglib2.0-0 \
              libgcrypt20 \
              libgpg-error0 \
              libdouble-conversion3 \
              libmd4c0 \
              libjpeg62-turbo \
              libevent-2.1-7 \
              libasound2 \
              libasound2-data \
              libgomp1 \
              libdrm2 \
              libxshmfence1 \
              libgl1-mesa-dri \
              fonts-dejavu-core \
              fonts-dejavu-extra \
              ca-certificates

            # ICU version can vary between base images; try the most recent, then fall back.
            apt-get install -y libicu72 || \
            apt-get install -y libicu70 || \
            apt-get install -y libicu67 || true

  setup_conda_env:
    steps:
      - run:
          name: Create conda env, install ROBERT/AQME/GUI/test dependencies
          command: |
            # ------------------------------------------------------------------
            # Proper conda initialization (non-interactive shell)
            # ------------------------------------------------------------------
            eval "$(conda shell.bash hook)"

            # Optional: updating conda can be slow; keep it if we want latest solver.
            conda update -y conda

            # Create and activate project-specific environment
            conda create -n cheminf python=3.12 -y
            conda activate cheminf

            # ------------------------------------------------------------------
            # Install project dependencies (ROBERT, AQME, GUI stack)
            # ------------------------------------------------------------------
            python -m pip install --upgrade pip

            # Core scientific and native dependencies from conda-forge:
            # - openbabel / xtb / libgfortran: chemistry-related tooling
            # - glib / gtk3 / pango / mscorefonts: required by WeasyPrint for PDF generation
            # - libxkbcommon: required by Qt for keyboard handling
            conda install -y -c conda-forge \
              openbabel=3.1.1 \
              xtb=6.7.1 \
              libgfortran=14.2.0 \
              libgcc-ng \
              glib \
              gtk3 \
              pango \
              libxkbcommon \
              mscorefonts \
              fonts-conda-forge

            # Ensure the dynamic linker can find native libraries installed inside the conda environment.
            # WeasyPrint loads GLib/Pango/Cairo through dlopen(), and without this path the loader may miss
            # libraries such as libgobject-2.0.so.0 that live in $CONDA_PREFIX/lib.
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}"

            # AQME (external dependency used in some workflows)
            pip install aqme==2.0.1

            # Install ROBERT/easyROB from the current repository as a package.
            # This also installs WeasyPrint==63.1 from PyPI via setup.py (install_requires).
            pip install .

            # Do NOT uninstall robert here - GUI tests import it as an installed package.

            # ------------------------------------------------------------------
            # Test tooling
            # ------------------------------------------------------------------
            pip install pytest pytest-cov pytest-qt

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  build-and-test-core: # the test_1curate->test_4predict pipeline + the other two slow,
    # real-pipeline files - see build-and-test-gui for everything else (GUI tests, plus
    # test_7api.py/test_split_selection.py, which moved there since it already finishes
    # in a few minutes and had room to spare, rather than giving them their own nodes here)
    # Split across 3 containers so the suite - which now includes several real, slow
    # AQME/xtb-based tests - fits within the per-job time limit instead of timing out
    # running everything sequentially. Every test file is pinned to a fixed node (see
    # the case statement below) - no `circleci tests split`/timing-based splitting at
    # all, since that returned an empty test list on at least one real run, which made
    # pytest silently fall back to auto-discovering (and running) the ENTIRE tests/
    # directory - including the 1h+ GUI suite that has its own dedicated job. A fully
    # static assignment can't do that: every node's test list is a literal, non-empty
    # string baked into the config
    parallelism: 3
    # These next lines defines a Docker executors: https://circleci.com/docs/2.0/executor-types/
    # You can specify an image from Dockerhub or use one of the convenience images from CircleCI's Developer Hub
    # A list of available CircleCI Docker convenience images are available here: https://circleci.com/developer/images/image/cimg/python
    # The executor is the environment in which the steps below will be executed - below will use a python 3.10.2 container
    # Change the version below to your required version of python
    docker:
      - image: continuumio/miniconda3
    # working_directory: /root/project
    # Checkout the code as the first step. This is a dedicated CircleCI step.
    # The python orb's install-packages step will install the dependencies from a Pipfile via Pipenv by default.
    # Here we're making sure we use just use the system-wide pip. By default it uses the project root's requirements.txt.
    # Then run your tests!
    # CircleCI will report the results back to your VCS provider.
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          # app-dir: ~/project/package-directory/  # If your requirements.txt isn't in the root directory.
          # pip-dependency-file: test-requirements.txt  # if you have a different name for your requirements file, maybe one that combines your runtime and test requirements.
      - install_system_deps
      - setup_conda_env
      - run:
          name: Run core tests with coverage
          command: |
            eval "$(conda shell.bash hook)"
            conda activate cheminf
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}"

            # CircleCI containers report the HOST's full core count (not what's actually
            # allocated to the container), so OpenMP/BLAS-threaded libraries (numpy/scipy/
            # scikit-learn here, xtb in the AQME tests) oversubscribe threads and badly
            # thrash/slow down instead of speeding up. Pinning to 1 thread per process fixed
            # this dramatically for AQME's own xtb calls (~10min instead of hanging/timing
            # out) - applying the same fix here since GENERATE's BO search and VERIFY/
            # PREDICT's repeated CV are just as numpy/scikit-learn-heavy
            export OMP_NUM_THREADS=1
            export OPENBLAS_NUM_THREADS=1
            export MKL_NUM_THREADS=1

            # ------------------------------------------------------------------
            # Focused AQME-only diagnostic flow kept here as commented reference
            # ------------------------------------------------------------------
            # python -m pytest \
            #   -vv \
            #   --cov=robert \
            #   --cov-report= \
            #   "tests/test_5aqme_n_full.py::test_AQME[aqme]" \
            #   "tests/test_5aqme_n_full.py::test_AQME[2smiles_columns]"

            # IMPORTANT:
            # CircleCI executes 'run' steps with 'set -e' (exit on first non-zero code).
            # We temporarily disable it so we can inspect pytest's exit code.
            set +e

            # ------------------------------------------------------------------
            # test_1curate -> test_2generate -> test_3verify -> test_4predict share
            # state through the working directory (each depends on folders the
            # previous one left behind - see test_4predict.py renaming a GENERATE
            # folder that only test_2generate.py creates), so that chain always
            # runs together, in order, on node 0 - it is NEVER split across
            # containers.
            #
            # Every core test file is pinned to a fixed node below - no
            # `circleci tests split --split-by=timings` at all. That was tried first,
            # but on at least one real run it returned an empty list for a node (most
            # likely because it needs a PREVIOUS run's stored timing data - see
            # store_test_results below - to split reliably, and this suite kept
            # timing out/failing before ever reaching that step), and an empty test
            # list makes the pytest call below fall back to auto-discovering the
            # entire tests/ directory - which is exactly the 1h+ bloat this was meant
            # to fix. A fully static list can't come back empty. (test_8report.py
            # used to be pinned here too, doing its own separate CURATE->GENERATE->
            # VERIFY->PREDICT->REPORT run - it's gone now, folded into
            # test_5aqme_n_full.py's full_workflow/full_clas cases, which call
            # report() again in-process right after their own subprocess run instead
            # of rebuilding the same pipeline from scratch a second time.)
            # ------------------------------------------------------------------
            mkdir -p test-results
            PIPELINE_TESTS="tests/test_1curate.py tests/test_2generate.py tests/test_3verify.py tests/test_4predict.py"

            case "$CIRCLE_NODE_INDEX" in
              0)
                CORE_TESTS="$PIPELINE_TESTS"
                ;;
              1)
                CORE_TESTS="tests/test_5aqme_n_full.py"
                ;;
              2)
                CORE_TESTS="tests/test_6evaluate.py"
                ;;
              *)
                CORE_TESTS=""
                ;;
            esac
            echo "[CI] Core tests assigned to node $CIRCLE_NODE_INDEX: $CORE_TESTS"

            # Safety net: with parallelism set to exactly the number of case branches above,
            # this should never trigger - but if parallelism is ever bumped without adding a
            # matching branch, a node would fall into the empty `*)` case and $CORE_TESTS
            # being empty would make the pytest call below run with NO file arguments at all,
            # which falls back to pytest's own default discovery of the ENTIRE tests/
            # directory - silently pulling in test_easyrob.py (a 1h+ GUI suite that has its
            # own dedicated job and was never meant to run here). Bail out loudly instead.
            if [ -z "$CORE_TESTS" ]; then
              echo "[CI] ERROR: no tests were assigned to node $CIRCLE_NODE_INDEX (circleci tests split returned nothing) - refusing to fall back to pytest's full auto-discovery"
              exit 1
            fi

            python -m pytest \
              -v \
              --durations=20 \
              --cov=robert \
              --cov-report= \
              --junitxml=test-results/core-test-results.xml \
              $CORE_TESTS

            CORE_EXIT_CODE=$?

            # Re-enable 'exit on error' for any subsequent commands.
            set -e

            if [ "$CORE_EXIT_CODE" -ne 0 ]; then
              echo "[CI] Core tests failed with exit code $CORE_EXIT_CODE"
              exit "$CORE_EXIT_CODE"
            fi

            coverage xml

            # ------------------------------------------------------------------
            # Upload this node's coverage directly - Codecov merges multiple uploads
            # for the same commit automatically, so with parallelism each node just
            # uploads its own slice instead of combining them into one file first
            # (the codecov orb doesn't work with this miniconda docker image, hence
            # the plain uploader script instead of codecov/upload)
            # ------------------------------------------------------------------
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process --disable-search --fail-on-error \
              -t "$CODECOV_TOKEN" -f coverage.xml -F "core-node-${CIRCLE_NODE_INDEX}"
      - store_test_results:
          path: test-results

  build-and-test-gui: # Bot and GUI tests under Xvfb, plus test_7api.py and
    # test_split_selection.py. The GUI suite runs in one container because
    # Qt/Xvfb resources are not safely shared between parallel nodes.
    docker:
      - image: continuumio/miniconda3
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - install_system_deps
      - setup_conda_env
      - run:
          name: Run API tests, then bot and GUI tests under Xvfb with combined coverage
          command: |
            eval "$(conda shell.bash hook)"
            conda activate cheminf
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}"

            # see the matching comment in build-and-test-core - CircleCI containers
            # oversubscribe OpenMP/BLAS threads otherwise (test_7api.py fits real models too)
            export OMP_NUM_THREADS=1
            export OPENBLAS_NUM_THREADS=1
            export MKL_NUM_THREADS=1

            mkdir -p test-results

            # IMPORTANT: CircleCI executes 'run' steps with 'set -e'. Temporarily
            # disabled so we can inspect pytest/xvfb-run's exit code and treat the
            # known Qt segfault (139/134) as a special case.
            set +e

            # ------------------------------------------------------------------
            # Fast, self-contained, non-GUI files first - no Xvfb needed for these
            # ------------------------------------------------------------------
            python -m pytest \
              -v \
              --durations=20 \
              --cov=robert \
              --cov-report= \
              --junitxml=test-results/fast-test-results.xml \
              tests/test_7api.py tests/test_split_selection.py

            FAST_EXIT_CODE=$?
            if [ "$FAST_EXIT_CODE" -ne 0 ]; then
              echo "[CI] test_7api.py/test_split_selection.py failed with exit code $FAST_EXIT_CODE"
              exit "$FAST_EXIT_CODE"
            fi

            export QT_QPA_PLATFORM=offscreen
            export QT_OPENGL=software
            export QT_RHI=software
            export QTWEBENGINE_DISABLE_SANDBOX=1
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu"

            # Keep the existing GUI suite in a separate Python process. Bot test
            # collection imports the same Qt modules under additional top-level
            # names (for example main.window and robert.gui_easyrob.main.window).
            # Those aliases otherwise remain loaded while test_easyrob.py runs.
            run_gui_suite() {
              local suite_name="$1"
              shift
              local result_file="test-results/${suite_name}-test-results.xml"

              xvfb-run -s "-screen 0 1920x1080x24" \
                python -m pytest \
                  -vv \
                  --durations=20 \
                  --cov=robert \
                  --cov-append \
                  --cov-report= \
                  --junitxml="$result_file" \
                  "$@" \
                2>&1 | tee "${suite_name}-pytest.log"
              local suite_exit_code=${PIPESTATUS[0]}

              # A Qt crash is acceptable only after pytest has written a
              # complete, passing JUnit result for this specific process.
              if [ "$suite_exit_code" -eq 139 ] || [ "$suite_exit_code" -eq 134 ]; then
                if [ ! -f "$result_file" ]; then
                  echo "[CI] ${suite_name} crashed before writing ${result_file}"
                  return "$suite_exit_code"
                fi

                python -c "import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); suites = [root] if root.tag == 'testsuite' else root.findall('testsuite'); tests = sum(int(s.attrib.get('tests', 0)) for s in suites); failures = sum(int(s.attrib.get('failures', 0)) for s in suites); errors = sum(int(s.attrib.get('errors', 0)) for s in suites); assert tests != 0, '[CI] Qt crashed with no collected tests in JUnit XML'; assert failures == 0 and errors == 0, f'[CI] Qt crashed after pytest failures (tests={tests}, failures={failures}, errors={errors})'; print(f'[CI WARNING] {tests} tests passed; Qt crashed after pytest wrote its JUnit report.')" "$result_file"
                local xml_exit_code=$?
                if [ "$xml_exit_code" -ne 0 ]; then
                  return "$xml_exit_code"
                fi
                return 0
              fi

              if [ "$suite_exit_code" -ne 0 ]; then
                echo "[CI] ${suite_name} tests failed with exit code $suite_exit_code"
                return "$suite_exit_code"
              fi
            }

            run_gui_suite easyrob tests/test_easyrob.py
            GUI_EXIT_CODE=$?
            if [ "$GUI_EXIT_CODE" -ne 0 ]; then
              exit "$GUI_EXIT_CODE"
            fi

            run_gui_suite bot tests/test_bot_compact_core.py tests/test_bot_compact_gui.py
            GUI_EXIT_CODE=$?
            if [ "$GUI_EXIT_CODE" -ne 0 ]; then
              exit "$GUI_EXIT_CODE"
            fi

            # Re-enable 'exit on error' for any subsequent commands.
            set -e

            coverage xml

            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process --disable-search --fail-on-error \
              -t "$CODECOV_TOKEN" -f coverage.xml -F "gui"
      - store_test_results:
          path: test-results

  # Same dependency stack and pytest suite as build-and-test-core, on Windows (win-64).
  # Coverage isn't uploaded from here - codecov stays on the Linux jobs only.
  build-and-test-windows:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
    shell: bash.exe
    steps:
      - checkout
      - run:
          name: Conda env, install deps, pytest (Windows)
          command: |
            set -euo pipefail
            conda update -y conda
            eval "$(conda shell.bash hook)"
            conda create -y -n cheminf python=3.12
            conda activate cheminf
            python -m pip install --upgrade pip
            conda install -y -c conda-forge openbabel=3.1.1
            conda install -y -c conda-forge xtb=6.7.1
            conda install -y -c conda-forge glib
            pip install weasyprint
            conda install -y -c conda-forge gtk3
            conda install -y -c conda-forge pango
            pip install aqme==2.0.1
            pip install .
            pip uninstall -y robert
            pip install pytest
            pip install pytest-cov
            python -m pytest -v --durations=20 --cov=robert --cov-report=xml --cov-report=term

workflows:
  sample:
    jobs:
      - build-and-test-core
      - build-and-test-gui
