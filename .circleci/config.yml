# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/2.0/orb-intro/ 
orbs:
  # The python orb contains a set of prepackaged CircleCI configuration you can use repeatedly in your configuration files
  # Orb commands and jobs help you with common scripting around a language/tool
  # so you dont have to copy and paste it everywhere.
  # See the orb documentation here: https://circleci.com/developer/orbs/orb/circleci/python
  python: circleci/python@2.1.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  build-and-test: # This is the name of the job, feel free to change it to better match what you're trying to do!
    # Split across 6 containers so the suite - which now includes several real, slow
    # AQME/xtb-based tests - fits within the per-job time limit instead of timing out
    # running everything sequentially. Node 0 gets the test_1curate->test_4predict
    # pipeline chain + GUI tests; nodes 1-3 each get one of the three other slow, real-
    # pipeline files (test_5aqme_n_full.py / test_6evaluate.py / test_8report.py),
    # pinned individually rather than left to timing-based splitting (see below); nodes
    # 4-5 share what's left (see the case statement below for the exact assignment)
    parallelism: 6
    # These next lines defines a Docker executors: https://circleci.com/docs/2.0/executor-types/
    # You can specify an image from Dockerhub or use one of the convenience images from CircleCI's Developer Hub
    # A list of available CircleCI Docker convenience images are available here: https://circleci.com/developer/images/image/cimg/python
    # The executor is the environment in which the steps below will be executed - below will use a python 3.10.2 container
    # Change the version below to your required version of python
    docker:
      - image: continuumio/miniconda3
    # working_directory: /root/project
    # Checkout the code as the first step. This is a dedicated CircleCI step.
    # The python orb's install-packages step will install the dependencies from a Pipfile via Pipenv by default.
    # Here we're making sure we use just use the system-wide pip. By default it uses the project root's requirements.txt.
    # Then run your tests!
    # CircleCI will report the results back to your VCS provider.
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          # app-dir: ~/project/package-directory/  # If your requirements.txt isn't in the root directory.
          # pip-dependency-file: test-requirements.txt  # if you have a different name for your requirements file, maybe one that combines your runtime and test requirements.

     # Install system-level dependencies required by Qt/PySide6 and WeasyPrint
      - run:
          name: Install system dependencies for Qt/PySide6 and WeasyPrint
          command: |
            apt-get update
            apt-get install -y \
              curl \
              xvfb \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libxcb-render0 \
              libxcb-shape0 \
              libxcb-shm0 \
              libxcb-randr0 \
              libxcb-xfixes0 \
              libxcb-keysyms1 \
              libxrandr2 \
              libxcomposite1 \
              libxdamage1 \
              libxi6 \
              libxtst6 \
              libxext6 \
              libxrender1 \
              libxau6 \
              libxdmcp6 \
              libice6 \
              libsm6 \
              libdbus-1-3 \
              libgl1 \
              libegl1 \
              libgles2 \
              libopengl0 \
              libfontconfig1 \
              libfreetype6 \
              libharfbuzz0b \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libcairo2 \
              libpangoft2-1.0-0 \
              shared-mime-info \
              libnss3 \
              libnspr4 \
              libxkbcommon0 \
              libxkbfile1 \
              libxkbcommon-x11-0 \
              libxcb-util1 \
              libxcb-xkb1 \
              libxss1 \
              libxcursor1 \
              libatomic1 \
              zlib1g \
              libpcre2-8-0 \
              libffi8 \
              libuuid1 \
              libglib2.0-0 \
              libgcrypt20 \
              libgpg-error0 \
              libdouble-conversion3 \
              libmd4c0 \
              libjpeg62-turbo \
              libevent-2.1-7 \
              libasound2 \
              libasound2-data \
              libgomp1 \
              libdrm2 \
              libxshmfence1 \
              libgl1-mesa-dri \
              fonts-dejavu-core \
              fonts-dejavu-extra \
              ca-certificates

            # ICU version can vary between base images; try the most recent, then fall back.
            apt-get install -y libicu72 || \
            apt-get install -y libicu70 || \
            apt-get install -y libicu67 || true

      # Create conda environment, install ROBERT/easyROB + test stack, run tests & generate coverage
      - run:
          name: Run core and GUI tests with combined coverage
          command: |
            # ------------------------------------------------------------------
            # Proper conda initialization (non-interactive shell)
            # ------------------------------------------------------------------
            eval "$(conda shell.bash hook)"

            # Optional: updating conda can be slow; keep it if we want latest solver.
            conda update -y conda

            # Create and activate project-specific environment
            conda create -n cheminf python=3.12 -y
            conda activate cheminf

            # ------------------------------------------------------------------
            # Install project dependencies (ROBERT, AQME, GUI stack)
            # ------------------------------------------------------------------
            python -m pip install --upgrade pip

            # Core scientific and native dependencies from conda-forge:
            # - openbabel / xtb / libgfortran: chemistry-related tooling
            # - glib / gtk3 / pango / mscorefonts: required by WeasyPrint for PDF generation
            # - libxkbcommon: required by Qt for keyboard handling
            conda install -y -c conda-forge \
              openbabel=3.1.1 \
              xtb=6.7.1 \
              libgfortran=14.2.0 \
              libgcc-ng \
              glib \
              gtk3 \
              pango \
              libxkbcommon \
              mscorefonts \
              fonts-conda-forge

            # Ensure the dynamic linker can find native libraries installed inside the conda environment.
            # WeasyPrint loads GLib/Pango/Cairo through dlopen(), and without this path the loader may miss
            # libraries such as libgobject-2.0.so.0 that live in $CONDA_PREFIX/lib.
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}"

            # AQME (external dependency used in some workflows)
            pip install aqme==2.0.0

            # Install ROBERT/easyROB from the current repository as a package.
            # This also installs WeasyPrint==63.1 from PyPI via setup.py (install_requires).
            pip install .

            # Do NOT uninstall robert here - GUI tests import it as an installed package.

            # ------------------------------------------------------------------
            # Test tooling
            # ------------------------------------------------------------------
            pip install pytest pytest-cov pytest-qt

            # ------------------------------------------------------------------
            # Focused AQME-only diagnostic flow kept here as commented reference
            # ------------------------------------------------------------------
            # python -m pytest \
            #   -vv \
            #   --cov=robert \
            #   --cov-report= \
            #   "tests/test_5aqme_n_full.py::test_AQME[aqme]" \
            #   "tests/test_5aqme_n_full.py::test_AQME[2smiles_columns]"

            # IMPORTANT:
            # CircleCI executes 'run' steps with 'set -e' (exit on first non-zero code).
            # We temporarily disable it so we can inspect pytest/xvfb-run exit codes
            # and treat the known Qt segfault (139/134) as a special case.
            set +e

            # ------------------------------------------------------------------
            # Run core (non-GUI) tests. test_1curate -> test_2generate ->
            # test_3verify -> test_4predict share state through the working
            # directory (each depends on folders the previous one left behind - see
            # test_4predict.py renaming a GENERATE folder that only test_2generate.py
            # creates), so that chain always runs together, in order, on node 0 - it
            # is NEVER split across containers.
            #
            # test_5aqme_n_full.py and test_6evaluate.py are each pinned to their own
            # node instead of being split by `circleci tests split --split-by=timings`:
            # they're the slowest individual files (each runs one or more full, real
            # CURATE->GENERATE->VERIFY->PREDICT(->REPORT) pipelines), and
            # --split-by=timings only balances well once a PREVIOUS run has completed
            # far enough to reach store_test_results below - while this suite kept
            # timing out/failing before that point, the split never had real timing
            # data and kept guessing by name, occasionally piling multiple slow files
            # onto the same node. (test_8report.py used to be pinned here too, doing
            # its own separate CURATE->GENERATE->VERIFY->PREDICT->REPORT run - it's
            # gone now, folded into test_5aqme_n_full.py's full_workflow/full_clas
            # cases, which call report() again in-process right after their own
            # subprocess run instead of rebuilding the same pipeline from scratch a
            # second time.) Only the remaining, genuinely fast/self-contained files
            # (test_7api.py, test_split_selection.py) are left to the timing-based
            # split, across whatever nodes are left over.
            # ------------------------------------------------------------------
            mkdir -p test-results
            PIPELINE_TESTS="tests/test_1curate.py tests/test_2generate.py tests/test_3verify.py tests/test_4predict.py"

            case "$CIRCLE_NODE_INDEX" in
              0)
                CORE_TESTS="$PIPELINE_TESTS"
                ;;
              1)
                CORE_TESTS="tests/test_5aqme_n_full.py"
                ;;
              2)
                CORE_TESTS="tests/test_6evaluate.py"
                ;;
              *)
                CORE_TESTS=$(circleci tests glob "tests/*.py" \
                  | grep -v -e test_easyrob.py -e conftest.py \
                            -e test_1curate.py -e test_2generate.py -e test_3verify.py -e test_4predict.py \
                            -e test_5aqme_n_full.py -e test_6evaluate.py \
                  | circleci tests split --split-by=timings)
                ;;
            esac
            echo "[CI] Core tests assigned to node $CIRCLE_NODE_INDEX: $CORE_TESTS"

            python -m pytest \
              -v \
              --durations=20 \
              --cov=robert \
              --cov-report= \
              --junitxml=test-results/core-test-results.xml \
              $CORE_TESTS

            CORE_EXIT_CODE=$?
            if [ "$CORE_EXIT_CODE" -ne 0 ]; then
              echo "[CI] Core tests failed with exit code $CORE_EXIT_CODE"
              exit "$CORE_EXIT_CODE"
            fi

            # ------------------------------------------------------------------
            # GUI tests (tests/test_easyrob.py) only run once, on node 0 - it's a
            # single file/suite under Xvfb that doesn't split well across containers,
            # and Qt/Xvfb resources aren't safely shared between parallel containers
            # ------------------------------------------------------------------
            if [ "$CIRCLE_NODE_INDEX" = "0" ]; then
              export QT_QPA_PLATFORM=offscreen
              export QT_OPENGL=software
              export QT_RHI=software
              export QTWEBENGINE_DISABLE_SANDBOX=1
              export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu"

              xvfb-run -s "-screen 0 1920x1080x24" \
                python -m pytest \
                  -vv \
                  --durations=20 \
                  --cov=robert \
                  --cov-append \
                  --cov-report= \
                  --junitxml=test-results/gui-test-results.xml \
                  tests/test_easyrob.py \
                2>&1 | tee gui-pytest.log
              GUI_EXIT_CODE=${PIPESTATUS[0]}
            else
              GUI_EXIT_CODE=0
            fi

            # Re-enable 'exit on error' for any subsequent commands.
            set -e

            # PySide6/Qt sometimes causes a segmentation fault (exit code 139/134)
            # on interpreter shutdown after all tests have passed.
            if [ "$GUI_EXIT_CODE" -eq 139 ] || [ "$GUI_EXIT_CODE" -eq 134 ]; then
              if [ ! -f test-results/gui-test-results.xml ]; then
                echo "[CI] GUI tests crashed with exit code $GUI_EXIT_CODE and did not generate gui-test-results.xml"
                exit "$GUI_EXIT_CODE"
              fi

              python -c "import sys, xml.etree.ElementTree as ET; root = ET.parse('test-results/gui-test-results.xml').getroot(); suites = [root] if root.tag == 'testsuite' else root.findall('testsuite'); tests = sum(int(s.attrib.get('tests', 0)) for s in suites); failures = sum(int(s.attrib.get('failures', 0)) for s in suites); errors = sum(int(s.attrib.get('errors', 0)) for s in suites); assert tests != 0, '[CI] GUI tests crashed with no collected tests in junit xml'; assert failures == 0 and errors == 0, f'[CI] GUI tests exited with crash code after real pytest failures (tests={tests}, failures={failures}, errors={errors}).'; print(f'[CI WARNING] GUI tests passed but Qt/PySide6 crashed on interpreter shutdown (tests={tests}, exit code preserved outside pytest).')"
              GUI_XML_EXIT_CODE=$?
              if [ "$GUI_XML_EXIT_CODE" -ne 0 ]; then
                exit "$GUI_XML_EXIT_CODE"
              fi

              echo "[CI WARNING] GUI tests completed, but Qt/PySide6 triggered a crash on interpreter shutdown (exit code $GUI_EXIT_CODE)."
              echo "[CI WARNING] This is usually caused by threads or Qt resources not being fully cleaned up (e.g., QThread/QThreadPool/QProcess still running)."
              echo "[CI WARNING] Treating exit code $GUI_EXIT_CODE as success because pytest itself reported no failures."
              GUI_EXIT_CODE=0
            fi

            # Any other non-zero exit code is treated as a real failure.
            if [ "$GUI_EXIT_CODE" -ne 0 ]; then
              echo "[CI] GUI tests failed with exit code $GUI_EXIT_CODE"
              exit "$GUI_EXIT_CODE"
            fi

            # Generate this node's own coverage report (core test subset + GUI on node 0)
            coverage xml

            # ------------------------------------------------------------------
            # Upload this node's coverage directly - Codecov merges multiple uploads
            # for the same commit automatically, so with parallelism each node just
            # uploads its own slice instead of combining them into one file first
            # (the codecov orb doesn't work with this miniconda docker image, hence
            # the plain uploader script instead of codecov/upload)
            # ------------------------------------------------------------------
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process --disable-search --fail-on-error \
              -t "$CODECOV_TOKEN" -f coverage.xml -F "node-${CIRCLE_NODE_INDEX}"
      - store_test_results:
          path: test-results

  # Same dependency stack and pytest suite as build-and-test, on Windows (win-64).
  # Coverage isn't uploaded from here - codecov stays on the Linux job only.
  build-and-test-windows:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
    shell: bash.exe
    steps:
      - checkout
      - run:
          name: Conda env, install deps, pytest (Windows)
          command: |
            set -euo pipefail
            conda update -y conda
            eval "$(conda shell.bash hook)"
            conda create -y -n cheminf python=3.12
            conda activate cheminf
            python -m pip install --upgrade pip
            conda install -y -c conda-forge openbabel=3.1.1
            conda install -y -c conda-forge xtb=6.7.1
            conda install -y -c conda-forge glib
            pip install weasyprint
            conda install -y -c conda-forge gtk3
            conda install -y -c conda-forge pango
            pip install aqme==2.0.1
            pip install .
            pip uninstall -y robert
            pip install pytest
            pip install pytest-cov
            python -m pytest -v --durations=20 --cov=robert --cov-report=xml --cov-report=term

workflows:
  sample:
    jobs:
      - build-and-test
