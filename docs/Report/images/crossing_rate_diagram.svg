<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Two side-by-side true-vs-predicted plots for the same four extreme points, each with the region above the training maximum shaded as the extrapolation zone. In the left plot the predictions are clipped back to the training maximum instead of entering that zone; in the right plot the predictions follow the true-value trend into it.">
  <defs>
    <pattern id="hatchRed" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f96969" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <pattern id="hatchBlue" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1f77b4" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="640" height="290" fill="#ffffff"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

    <!-- panel A: clips -->
    <text x="160" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#e0575a">Clips at the boundary</text>
    <text x="160" y="40" text-anchor="middle" font-size="11.5" fill="#78766c" font-family="Consolas,monospace">crossing rate &lt; 20% &#8594; &#8722;2</text>

    <rect x="30" y="50" width="260" height="180" rx="8" fill="#ffffff" stroke="#e0575a" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="30" y="50" width="260" height="120" fill="#f96969" fill-opacity="0.05"/>
    <rect x="30" y="50" width="260" height="120" fill="url(#hatchRed)"/>
    <text x="40" y="68" font-size="11" font-style="italic" fill="#e0575a" fill-opacity="0.7" font-family="Consolas,monospace">extrapolation zone</text>

    <line x1="30" y1="170" x2="290" y2="170" stroke="#333" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="34" y="184" font-size="11" fill="#78766c" font-family="Consolas,monospace">training max</text>

    <!-- ideal true = predicted trend, extended into the shaded zone -->
    <line x1="55" y1="225" x2="285" y2="58" stroke="#333" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 3"/>

    <!-- true points (on the trend line, climbing into the extrapolation zone) -->
    <circle cx="150" cy="154.8" r="4" fill="#555" opacity="0.6"/>
    <circle cx="190" cy="125.2" r="4" fill="#555" opacity="0.6"/>
    <circle cx="230" cy="95.7" r="4" fill="#555" opacity="0.6"/>
    <circle cx="270" cy="66.1" r="4" fill="#555" opacity="0.6"/>

    <!-- stems from true value down to the clipped prediction -->
    <line x1="150" y1="154.8" x2="150" y2="170" stroke="#e0575a" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="190" y1="125.2" x2="190" y2="170" stroke="#e0575a" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="230" y1="95.7" x2="230" y2="170" stroke="#e0575a" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="270" y1="66.1" x2="270" y2="170" stroke="#e0575a" stroke-width="1" stroke-opacity="0.55"/>

    <!-- predictions: all clamped exactly at the training max, however high the true value climbs -->
    <circle cx="150" cy="170" r="4.5" fill="#e0575a"/>
    <circle cx="190" cy="170" r="4.5" fill="#e0575a"/>
    <circle cx="230" cy="170" r="4.5" fill="#e0575a"/>
    <circle cx="270" cy="170" r="4.5" fill="#e0575a"/>

    <circle cx="220" cy="204" r="4" fill="#555" opacity="0.6"/>
    <text x="232" y="208" font-size="10.5" fill="#78766c" font-family="Consolas,monospace">true</text>
    <circle cx="220" cy="220" r="4.5" fill="#e0575a"/>
    <text x="232" y="224" font-size="10.5" fill="#78766c" font-family="Consolas,monospace">predicted</text>

    <!-- panel B: extrapolates -->
    <text x="480" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1f77b4">Extrapolates</text>
    <text x="480" y="40" text-anchor="middle" font-size="11.5" fill="#78766c" font-family="Consolas,monospace">crossing rate &#8805; 50% &#8594; no penalty</text>

    <rect x="350" y="50" width="260" height="180" rx="8" fill="#ffffff" stroke="#1f77b4" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="350" y="50" width="260" height="120" fill="#1f77b4" fill-opacity="0.05"/>
    <rect x="350" y="50" width="260" height="120" fill="url(#hatchBlue)"/>
    <text x="360" y="68" font-size="11" font-style="italic" fill="#1f77b4" fill-opacity="0.7" font-family="Consolas,monospace">extrapolation zone</text>

    <line x1="350" y1="170" x2="610" y2="170" stroke="#333" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="354" y="184" font-size="11" fill="#78766c" font-family="Consolas,monospace">training max</text>

    <line x1="375" y1="225" x2="605" y2="58" stroke="#333" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 3"/>

    <!-- true points, same trend as panel A -->
    <circle cx="470" cy="154.8" r="4" fill="#555" opacity="0.6"/>
    <circle cx="510" cy="125.2" r="4" fill="#555" opacity="0.6"/>
    <circle cx="550" cy="95.7" r="4" fill="#555" opacity="0.6"/>
    <circle cx="590" cy="66.1" r="4" fill="#555" opacity="0.6"/>

    <!-- short stems: predictions track the true value closely, still inside the shaded zone -->
    <line x1="470" y1="154.8" x2="470" y2="164.8" stroke="#1f77b4" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="510" y1="125.2" x2="510" y2="135.2" stroke="#1f77b4" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="550" y1="95.7" x2="550" y2="105.7" stroke="#1f77b4" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="590" y1="66.1" x2="590" y2="76.1" stroke="#1f77b4" stroke-width="1" stroke-opacity="0.55"/>

    <!-- predictions genuinely cross into the extrapolation zone, following the trend -->
    <circle cx="470" cy="164.8" r="4.5" fill="#1f77b4"/>
    <circle cx="510" cy="135.2" r="4.5" fill="#1f77b4"/>
    <circle cx="550" cy="105.7" r="4.5" fill="#1f77b4"/>
    <circle cx="590" cy="76.1" r="4.5" fill="#1f77b4"/>

  </g>
</svg>
