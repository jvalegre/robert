<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 155" role="img" aria-label="Two side-by-side sorted strips of data points, from lowest to highest target value. Left: the Low fold, where the bottom 20% is held out for testing and the model trains on the top 80%. Right: the High fold, where the top 20% is held out and the model trains on the bottom 80%. These are two separate 80/20 splits, not one three-way split.">
  <rect x="0" y="0" width="640" height="155" fill="#ffffff"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

    <!-- panel A: Low fold -->
    <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1e1a">Low fold</text>
    <text x="160" y="44" text-anchor="middle" font-size="11.5" fill="#78766c" font-family="Consolas,monospace">bottom 20% held out</text>

    <rect x="30" y="64" width="260" height="70" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
    <line x1="40" y1="117" x2="280" y2="117" stroke="#333" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="40" y="106" width="48" height="24" rx="4" fill="#e0575a" fill-opacity="0.16" stroke="#e0575a" stroke-width="1.2"/>
    <rect x="88" y="106" width="192" height="24" rx="4" fill="#1f77b4" fill-opacity="0.10" stroke="#1f77b4" stroke-opacity="0.55" stroke-width="1.2"/>
    <g>
      <circle cx="48" cy="117" r="3.2" fill="#e0575a"/>
      <circle cx="64" cy="117" r="3.2" fill="#e0575a"/>
      <circle cx="80" cy="117" r="3.2" fill="#e0575a"/>
      <circle cx="100" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="122" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="144" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="166" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="188" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="210" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="232" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="254" cy="117" r="3" fill="#555" opacity="0.55"/>
      <circle cx="272" cy="117" r="3" fill="#555" opacity="0.55"/>
    </g>
    <text x="64" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#e0575a">Low 20%</text>
    <text x="64" y="97" text-anchor="middle" font-size="10" fill="#e0575a" font-family="Consolas,monospace">held out</text>
    <text x="184" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1f77b4">Top 80%</text>
    <text x="184" y="97" text-anchor="middle" font-size="10" fill="#1f77b4" font-family="Consolas,monospace">trains the model</text>

    <!-- panel B: High fold -->
    <g transform="translate(320,0)">
      <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1e1a">High fold</text>
      <text x="160" y="44" text-anchor="middle" font-size="11.5" fill="#78766c" font-family="Consolas,monospace">top 20% held out</text>

      <rect x="30" y="64" width="260" height="70" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
      <line x1="40" y1="117" x2="280" y2="117" stroke="#333" stroke-opacity="0.2" stroke-width="1"/>
      <rect x="40" y="106" width="192" height="24" rx="4" fill="#1f77b4" fill-opacity="0.10" stroke="#1f77b4" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="232" y="106" width="48" height="24" rx="4" fill="#e0575a" fill-opacity="0.16" stroke="#e0575a" stroke-width="1.2"/>
      <g>
        <circle cx="48" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="70" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="92" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="114" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="136" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="158" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="180" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="202" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="220" cy="117" r="3" fill="#555" opacity="0.55"/>
        <circle cx="240" cy="117" r="3.2" fill="#e0575a"/>
        <circle cx="256" cy="117" r="3.2" fill="#e0575a"/>
        <circle cx="272" cy="117" r="3.2" fill="#e0575a"/>
      </g>
      <text x="136" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1f77b4">Bottom 80%</text>
      <text x="136" y="97" text-anchor="middle" font-size="10" fill="#1f77b4" font-family="Consolas,monospace">trains the model</text>
      <text x="256" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#e0575a">High 20%</text>
      <text x="256" y="97" text-anchor="middle" font-size="10" fill="#e0575a" font-family="Consolas,monospace">held out</text>
    </g>
  </g>
</svg>
