# ROBERT environment. Create it with:
# Run from the repository root: conda env create -f environment/env_robert.yaml
name: robert
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - openbabel=3.1.1
  - xtb=6.7.1
  - openssl
  - pkg-config
  - glib
  - gtk3
  - pango
  - mscorefonts
  - libgfortran=14.2.0
  - pip
  - pip:
      - robert==2.2.0
      - plotly==6.9.0
      - aqme==2.0.1
      - pypdf==6.21.4
